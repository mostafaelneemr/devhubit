<!DOCTYPE html>
<html lang="en" dir="ltr" class="scroll-smooth" x-data="projectApp()" :lang="lang" :dir="lang === 'ar' ? 'rtl' : 'ltr'">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- Primary SEO Title & Meta Description -->
    <title x-text="lang === 'ar' ? currentProject.title.ar + ' | دراسة حالة DevHubIT' : currentProject.title.en + ' | DevHubIT Case Study'"></title>
    <meta name="description" content="Explore DevHubIT's engineering case studies: custom enterprise ERP systems, real-time IoT analytics dashboards, high-speed corporate portals, and e-commerce platforms.">
    <meta name="keywords" content="DevHubIT Case Studies, Custom ERP Case Study, IoT Analytics Dashboard, Enterprise Software Engineering">
    <meta name="author" content="DevHubIT Engineering Team">
    
    <!-- Canonical & Robots Metadata -->
    <link rel="canonical" href="https://devhubit.com/project-details.html" />
    <meta name="robots" content="index, follow, max-snippet:-1, max-image-preview:large, max-video-preview:-1">
    
    <!-- Hreflang Annotations -->
    <link rel="alternate" hreflang="en" href="https://devhubit.com/project-details.html" />
    <link rel="alternate" hreflang="ar" href="https://devhubit.com/project-details.html?lang=ar" />
    <link rel="alternate" hreflang="x-default" href="https://devhubit.com/project-details.html" />
    
    <!-- Open Graph (OG) Social Metadata -->
    <meta property="og:type" content="article">
    <meta property="og:url" content="https://devhubit.com/project-details.html">
    <meta property="og:title" content="DevHubIT Case Studies | Enterprise Software & Cloud Solutions">
    <meta property="og:description" content="Explore DevHubIT's engineering case studies: custom enterprise ERP systems, real-time IoT analytics dashboards, high-speed corporate portals, and e-commerce platforms.">
    <meta property="og:image" content="https://devhubit.com/img/og-preview.png">
    <meta property="og:locale" content="en_US">
    <meta property="og:locale:alternate" content="ar_AR">
    <meta property="og:site_name" content="DevHubIT">
    
    <!-- Twitter Card Metadata -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:url" content="https://devhubit.com/project-details.html">
    <meta name="twitter:title" content="DevHubIT Case Studies | Enterprise Software & Cloud Solutions">
    <meta name="twitter:description" content="Explore DevHubIT's engineering case studies: custom enterprise ERP systems, real-time IoT analytics dashboards, high-speed corporate portals, and e-commerce platforms.">
    <meta name="twitter:image" content="https://devhubit.com/img/og-preview.png">

    <!-- JSON-LD Structured Data (Case Study / SoftwareApplication Schema) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "SoftwareApplication",
      "name": "DevHubIT Software Solutions",
      "applicationCategory": "BusinessApplication",
      "operatingSystem": "Web, Cloud, iOS, Android",
      "author": {
        "@type": "Organization",
        "name": "DevHubIT",
        "url": "https://devhubit.com/"
      },
      "aggregateRating": {
        "@type": "AggregateRating",
        "ratingValue": "4.9",
        "ratingCount": "38"
      },
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "USD"
      }
    }
    </script>

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#f0f7ff',
                            100: '#e0effe',
                            400: '#38bdf8',
                            500: '#0284c7',
                            600: '#0284c7',
                            700: '#0369a1',
                            800: '#075985',
                            900: '#0c4a6e',
                            950: '#082f49',
                        }
                    }
                }
            }
        }
    </script>

    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Google Font (Cairo) -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

    <!-- AOS Animation Library CSS -->
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">

    <!-- Alpine.js -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>

    <style>
        body { font-family: 'Cairo', sans-serif; overflow-x: hidden; }
        .glow-cyan {
            box-shadow: 0 0 50px -10px rgba(56, 189, 248, 0.25);
        }
        .glow-emerald {
            box-shadow: 0 0 50px -10px rgba(16, 185, 129, 0.25);
        }
        .browser-scroll {
            max-height: 520px;
            overflow-y: auto;
            scrollbar-width: thin;
            scrollbar-color: rgba(56, 189, 248, 0.4) rgba(15, 23, 42, 0.8);
        }
        .browser-scroll::-webkit-scrollbar {
            width: 6px;
        }
        .browser-scroll::-webkit-scrollbar-track {
            background: rgba(15, 23, 42, 0.8);
        }
        .browser-scroll::-webkit-scrollbar-thumb {
            background: rgba(56, 189, 248, 0.4);
            border-radius: 3px;
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 antialiased selection:bg-brand-500 selection:text-white min-h-screen flex flex-col justify-between">

<!-- Ambient Background Glows -->
<div class="fixed -top-40 -left-40 w-[500px] h-[500px] bg-brand-500/10 rounded-full blur-[140px] pointer-events-none z-0"></div>
<div class="fixed top-1/2 -right-40 w-[500px] h-[500px] bg-emerald-500/10 rounded-full blur-[140px] pointer-events-none z-0"></div>

<!-- Top Sticky Header -->
<header class="sticky top-0 z-50 bg-white/85 backdrop-blur-xl border-b border-slate-200/80 transition-all duration-300 shadow-sm">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 h-20 flex items-center justify-between gap-4">
        
        <!-- Logo & Back Link -->
        <div class="flex items-center gap-4 sm:gap-6">
            <a href="index.html" class="text-xl sm:text-2xl font-black text-slate-900 tracking-tight flex items-center gap-2.5 hover:scale-105 transition transform">
                <div class="w-10 h-10 bg-blue-600/10 text-blue-600 rounded-xl flex items-center justify-center font-extrabold text-xl shadow-sm border border-blue-500/20">
                    <i class="fa-solid fa-circle-nodes text-blue-600"></i>
                </div>
                <span class="font-extrabold text-slate-900">Dev<span class="text-blue-600 font-black">Hub</span><span class="bg-emerald-500/10 text-emerald-600 text-xs px-1.5 py-0.5 rounded-md font-black border border-emerald-500/20 ml-1">IT</span></span>
            </a>

            <div class="h-6 w-px bg-slate-200 hidden sm:block"></div>

            <a href="index.html#portfolio" class="hidden sm:flex items-center gap-2 text-xs font-bold text-slate-600 hover:text-brand-600 transition bg-slate-100/80 border border-slate-200 px-3 py-1.5 rounded-lg shadow-sm">
                <i class="fa-solid" :class="lang === 'ar' ? 'fa-arrow-right' : 'fa-arrow-left'"></i>
                <span x-text="lang === 'ar' ? 'العودة للمشاريع' : 'Back to Projects'"></span>
            </a>
        </div>

        <!-- Navigation Actions & Language Switcher -->
        <div class="flex items-center gap-3 sm:gap-4">
            
            <!-- Mobile Back Button -->
            <a href="index.html#portfolio" class="sm:hidden text-xs font-bold text-slate-600 hover:text-brand-600 transition bg-slate-100 border border-slate-200 p-2 rounded-lg">
                <i class="fa-solid" :class="lang === 'ar' ? 'fa-arrow-right' : 'fa-arrow-left'"></i>
            </a>

            <!-- Language Switcher Button -->
            <button @click="lang = (lang === 'ar' ? 'en' : 'ar')" 
                    class="flex items-center gap-2 px-3 py-2 rounded-xl border border-slate-200 bg-white text-xs font-bold text-slate-700 hover:border-brand-500 hover:text-brand-600 transition shadow-sm">
                <i class="fa-solid fa-globe text-brand-600 text-sm"></i>
                <span x-text="lang === 'ar' ? 'English' : 'عربي'"></span>
            </button>

            <!-- WhatsApp CTA Button -->
            <a :href="'https://wa.me/201555646040?text=' + encodeURIComponent(lang === 'ar' ? 'السلام عليكم، حابب أستفسر عن دراسة حالة نظام (' + currentProject.title.ar + ')' : 'Hello DevHubIT, I am interested in a system similar to (' + currentProject.title.en + ')')" 
               target="_blank" 
               class="bg-gradient-to-r from-emerald-600 to-emerald-500 hover:from-emerald-500 hover:to-emerald-400 text-white px-4 py-2.5 rounded-xl font-bold text-xs sm:text-sm shadow-md shadow-emerald-600/25 flex items-center gap-2 transition transform hover:-translate-y-0.5">
                <i class="fa-brands fa-whatsapp text-lg"></i>
                <span class="hidden md:inline" x-text="lang === 'ar' ? 'تواصل عبر الواتساب' : 'Contact via WhatsApp'"></span>
                <span class="md:hidden" x-text="lang === 'ar' ? 'واتساب' : 'WhatsApp'"></span>
            </a>
        </div>
    </div>
</header>

<!-- Main Case Study Content Container -->
<main class="relative z-10 max-w-7xl mx-auto px-4 sm:px-6 py-10 lg:py-16 space-y-16 lg:space-y-24">

    <!-- 1. Hero Section -->
    <section class="grid lg:grid-cols-12 gap-10 lg:gap-12 items-center">
        
        <!-- Hero Details Column -->
        <div class="lg:col-span-7 space-y-6" data-aos="fade-right">
            
            <!-- Category & Status Badge -->
            <div class="flex flex-wrap items-center gap-3">
                <span class="inline-flex items-center gap-2 text-xs font-extrabold text-brand-700 bg-brand-50 border border-brand-200 px-3.5 py-1.5 rounded-full shadow-sm">
                    <i class="fa-solid fa-layer-group"></i>
                    <span x-text="lang === 'ar' ? currentProject.category.ar : currentProject.category.en"></span>
                </span>
                
                <span class="inline-flex items-center gap-1.5 text-xs font-bold text-emerald-700 bg-emerald-50 border border-emerald-200 px-3 py-1.5 rounded-full shadow-sm">
                    <span class="w-2 h-2 rounded-full bg-emerald-500 animate-ping inline-block"></span>
                    <span x-text="lang === 'ar' ? 'نظام حي ويعمل بكفاءة' : 'Production Verified'"></span>
                </span>
            </div>

            <!-- Title & Tagline -->
            <h1 class="text-3xl sm:text-4xl lg:text-5xl font-black text-slate-900 leading-tight tracking-tight"
                x-text="lang === 'ar' ? currentProject.title.ar : currentProject.title.en">
            </h1>

            <p class="text-slate-600 text-base sm:text-lg leading-relaxed font-normal border-l-4 border-brand-500 pl-4"
               :class="lang === 'ar' ? 'border-l-0 border-r-4 pl-0 pr-4' : ''"
               x-text="lang === 'ar' ? currentProject.tagline.ar : currentProject.tagline.en">
            </p>

            <!-- Meta Badges (Industry, Type, Tech Stack) -->
            <div class="space-y-4 pt-2">
                <div class="flex flex-wrap items-center gap-x-6 gap-y-3 text-xs sm:text-sm text-slate-600">
                    <div class="flex items-center gap-2">
                        <i class="fa-solid fa-building text-brand-600"></i>
                        <span class="font-bold text-slate-900" x-text="lang === 'ar' ? 'القطاع:' : 'Industry:'"></span>
                        <span x-text="lang === 'ar' ? currentProject.industry.ar : currentProject.industry.en"></span>
                    </div>

                    <div class="flex items-center gap-2">
                        <i class="fa-solid fa-laptop-code text-brand-600"></i>
                        <span class="font-bold text-slate-900" x-text="lang === 'ar' ? 'نوع النظام:' : 'System Type:'"></span>
                        <span x-text="lang === 'ar' ? currentProject.type.ar : currentProject.type.en"></span>
                    </div>
                </div>

                <!-- Tech Stack Tags -->
                <div class="flex flex-wrap items-center gap-2 pt-2">
                    <span class="text-xs font-bold text-slate-500 me-2" x-text="lang === 'ar' ? 'معمارية النظام:' : 'Capabilities:'"></span>
                    <template x-for="tech in currentProject.techStack" :key="tech">
                        <span class="bg-white border border-slate-200 text-slate-700 font-mono text-xs px-3 py-1 rounded-lg shadow-sm" x-text="tech"></span>
                    </template>
                </div>
            </div>

            <!-- Primary Action Buttons -->
            <div class="flex flex-wrap gap-4 pt-4">
                <!-- Request Similar System CTA -->
                <a :href="'https://wa.me/201555646040?text=' + encodeURIComponent(lang === 'ar' ? 'السلام عليكم، أود طلب تطوير نظام مماثل لمشروع (' + currentProject.title.ar + ')' : 'Hi DevHubIT, I would like to request a similar system to (' + currentProject.title.en + ')')"
                   target="_blank"
                   class="bg-brand-600 hover:bg-brand-700 text-white font-extrabold text-sm sm:text-base px-7 py-3.5 rounded-xl shadow-lg shadow-brand-500/25 flex items-center gap-2.5 transition transform hover:-translate-y-0.5">
                    <i class="fa-solid fa-rocket text-yellow-300"></i>
                    <span x-text="lang === 'ar' ? 'طلب نظام مماثل' : 'Request Similar System'"></span>
                </a>

                <!-- Live Preview Button -->
                <a :href="currentProject.liveUrl" 
                   target="_blank"
                   x-show="currentProject.liveUrl"
                   class="bg-white hover:bg-slate-50 border border-slate-200 text-slate-700 font-bold text-sm sm:text-base px-6 py-3.5 rounded-xl transition shadow-sm flex items-center gap-2">
                    <i class="fa-solid fa-up-right-from-square text-emerald-600"></i>
                    <span x-text="lang === 'ar' ? 'زيارة الموقع' : 'Live Preview'"></span>
                </a>

                <!-- Preview Screenshots Button -->
                <button @click="openLightbox(currentProject.heroImage)"
                        class="bg-white hover:bg-slate-50 border border-slate-200 text-slate-700 font-bold text-sm sm:text-base px-5 py-3.5 rounded-xl transition shadow-sm flex items-center gap-2">
                    <i class="fa-solid fa-eye text-brand-600"></i>
                    <span x-text="lang === 'ar' ? 'معاينة الشاشات' : 'Preview Screenshots'"></span>
                </button>
            </div>

        </div>

        <!-- Hero Laptop/Browser Mockup Showcase Column -->
        <div class="lg:col-span-5" data-aos="fade-left">
            <div class="relative rounded-2xl overflow-hidden bg-white border border-slate-200 shadow-2xl shadow-slate-200/80">
                <!-- Browser Header Controls -->
                <div class="bg-slate-100 border-b border-slate-200 px-4 py-3 flex items-center justify-between">
                    <div class="flex items-center gap-2">
                        <span class="w-3 h-3 rounded-full bg-red-400 inline-block"></span>
                        <span class="w-3 h-3 rounded-full bg-yellow-400 inline-block"></span>
                        <span class="w-3 h-3 rounded-full bg-green-400 inline-block"></span>
                    </div>
                    <div class="bg-white border border-slate-200 rounded-md px-3 py-1 text-[11px] font-mono text-slate-600 flex items-center gap-1.5 truncate max-w-[220px] shadow-inner">
                        <i class="fa-solid fa-lock text-emerald-600 text-[9px]"></i>
                        <span x-text="currentProject.urlDisplay"></span>
                    </div>
                    <div class="text-xs text-slate-400">
                        <i class="fa-solid fa-arrows-rotate"></i>
                    </div>
                </div>

                <!-- Scrollable Full-Page Capture Frame -->
                <div class="browser-scroll cursor-pointer group relative" @click="openLightbox(currentProject.heroImage)">
                    <img :src="currentProject.heroImage" 
                          :alt="currentProject.title.en"
                          class="w-full object-top transition duration-500 group-hover:opacity-90">
                    
                    <div class="absolute inset-0 bg-slate-900/30 opacity-0 group-hover:opacity-100 transition-opacity flex items-center justify-center">
                        <span class="bg-brand-600 text-white font-bold text-xs px-4 py-2 rounded-xl shadow-lg backdrop-blur-md flex items-center gap-2">
                            <i class="fa-solid fa-magnifying-glass-plus"></i>
                            <span x-text="lang === 'ar' ? 'انقر لتكبير الصورة الكاملة' : 'Click to View Fullsize'"></span>
                        </span>
                    </div>
                </div>
            </div>
        </div>

    </section>

    <!-- 2. Interactive Screenshot Gallery Section -->
    <section class="space-y-8" data-aos="fade-up">
        <div class="flex flex-col md:flex-row md:items-end justify-between gap-4 border-b border-slate-200/80 pb-6">
            <div>
                <span class="text-brand-700 font-extrabold text-xs uppercase tracking-widest bg-brand-50 border border-brand-200 px-3 py-1 rounded-md"
                      x-text="lang === 'ar' ? 'معرض الواجهات الشامل' : 'System UI Showcase'"></span>
                <h2 class="text-2xl sm:text-3xl font-extrabold text-slate-900 mt-3"
                    x-text="lang === 'ar' ? 'شاشات ولوحات تحكم النظام' : 'Dashboard & Subsystem Captures'"></h2>
            </div>
            <p class="text-slate-600 text-xs sm:text-sm max-w-md"
               x-text="lang === 'ar' ? 'اضغط على أي صورة لفتحها وحجمها الكامل واستعراض التفاصيل البرمجية.' : 'Click on any dashboard screen to open high-resolution lightbox view.'"></p>
        </div>

        <!-- Screenshots Grid -->
        <div class="grid sm:grid-cols-2 lg:grid-cols-3 gap-6">
            <template x-for="(screen, index) in currentProject.gallery" :key="index">
                <div @click="openLightbox(screen.img)" 
                     class="group relative bg-white border border-slate-200/80 rounded-2xl overflow-hidden cursor-pointer hover:border-brand-500/60 transition-all duration-300 hover:-translate-y-1.5 shadow-md hover:shadow-xl">
                    
                    <div class="h-48 sm:h-56 bg-slate-100 overflow-hidden relative">
                        <img :src="screen.img" 
                             :alt="screen.title.en" 
                             class="w-full h-full object-cover object-top transition duration-500 group-hover:scale-105">
                        
                        <div class="absolute inset-0 bg-gradient-to-t from-slate-900/60 via-transparent to-transparent opacity-80 group-hover:opacity-40 transition"></div>
                        
                        <div class="absolute top-3 right-3 bg-white/90 border border-slate-200 text-brand-600 text-[10px] font-bold px-2.5 py-1 rounded-md shadow-sm">
                            <span x-text="'0' + (index + 1)"></span>
                        </div>
                    </div>

                    <div class="p-5 border-t border-slate-100 bg-white">
                        <h4 class="font-bold text-slate-900 text-sm sm:text-base group-hover:text-brand-600 transition"
                            x-text="lang === 'ar' ? screen.title.ar : screen.title.en"></h4>
                        <p class="text-slate-500 text-xs mt-1"
                           x-text="lang === 'ar' ? screen.desc.ar : screen.desc.en"></p>
                    </div>
                </div>
            </template>
        </div>
    </section>

    <!-- 3. System Case Study Details (Challenge, Solution, Features) -->
    <section class="grid lg:grid-cols-3 gap-8">
        
        <!-- Card 1: The Challenge (التحدي البرمجي) -->
        <div class="bg-white border border-red-200/80 rounded-3xl p-7 lg:p-8 space-y-5 relative overflow-hidden group hover:border-red-400 transition-all duration-300 shadow-lg shadow-slate-200/50" data-aos="fade-up" data-aos-delay="100">
            <div class="w-12 h-12 rounded-2xl bg-red-50 border border-red-100 text-red-600 flex items-center justify-center text-xl font-bold">
                <i class="fa-solid fa-triangle-exclamation"></i>
            </div>
            
            <span class="block text-xs font-extrabold uppercase tracking-widest text-red-600"
                  x-text="lang === 'ar' ? 'التحدي البرمجي قبل النظام' : 'The Engineering Challenge'"></span>

            <h3 class="text-xl font-extrabold text-slate-900"
                x-text="lang === 'ar' ? 'مشاكل وسيناريو العمل السابق' : 'Problem Statement & Friction'"></h3>

            <p class="text-slate-600 text-sm leading-relaxed"
               x-text="lang === 'ar' ? currentProject.challenge.ar : currentProject.challenge.en"></p>

            <div class="pt-2 border-t border-slate-100 flex items-center gap-2 text-xs text-red-600 font-semibold">
                <i class="fa-solid fa-circle-xmark"></i>
                <span x-text="lang === 'ar' ? 'بطء التشغيل وفقدان البيانات والتقارير' : 'Manual bottleneck & data lag'"></span>
            </div>
        </div>

        <!-- Card 2: Our Engineering Solution (الحل البرمجي من DevHubIT) -->
        <div class="bg-white border border-brand-200 rounded-3xl p-7 lg:p-8 space-y-5 relative overflow-hidden group hover:border-brand-400 transition-all duration-300 shadow-lg shadow-brand-500/10" data-aos="fade-up" data-aos-delay="200">
            <div class="w-12 h-12 rounded-2xl bg-brand-50 border border-brand-100 text-brand-600 flex items-center justify-center text-xl font-bold">
                <i class="fa-solid fa-microchip"></i>
            </div>

            <span class="block text-xs font-extrabold uppercase tracking-widest text-brand-600"
                  x-text="lang === 'ar' ? 'الحل البرمجي من DevHubIT' : 'DevHubIT Engineering Solution'"></span>

            <h3 class="text-xl font-extrabold text-slate-900"
                x-text="lang === 'ar' ? 'معمارية وأداء النظام السحابي' : 'Architecture & Optimizations'"></h3>

            <p class="text-slate-600 text-sm leading-relaxed"
               x-text="lang === 'ar' ? currentProject.solution.ar : currentProject.solution.en"></p>

            <div class="pt-2 border-t border-slate-100 flex items-center gap-2 text-xs text-brand-600 font-semibold">
                <i class="fa-solid fa-bolt"></i>
                <span x-text="lang === 'ar' ? 'استجابة فائقة وقواعد بيانات عالية الكفاءة' : 'Sub-millisecond query execution'"></span>
            </div>
        </div>

        <!-- Card 3: Key System Features (مميزات النظام) -->
        <div class="bg-white border border-emerald-200/80 rounded-3xl p-7 lg:p-8 space-y-5 relative overflow-hidden group hover:border-emerald-400 transition-all duration-300 shadow-lg shadow-slate-200/50" data-aos="fade-up" data-aos-delay="300">
            <div class="w-12 h-12 rounded-2xl bg-emerald-50 border border-emerald-100 text-emerald-600 flex items-center justify-center text-xl font-bold">
                <i class="fa-solid fa-list-check"></i>
            </div>

            <span class="block text-xs font-extrabold uppercase tracking-widest text-emerald-600"
                  x-text="lang === 'ar' ? 'مميزات النظام الرئيسية' : 'Key System Features'"></span>

            <h3 class="text-xl font-extrabold text-slate-900"
                x-text="lang === 'ar' ? 'أبرز الوحدات والوظائف' : 'Core System Capabilities'"></h3>

            <ul class="space-y-3 text-xs sm:text-sm text-slate-600">
                <template x-for="(feat, idx) in currentProject.features" :key="idx">
                    <li class="flex items-start gap-2.5">
                        <i class="fa-solid fa-circle-check text-emerald-500 text-base mt-0.5"></i>
                        <span x-text="lang === 'ar' ? feat.ar : feat.en"></span>
                    </li>
                </template>
            </ul>
        </div>

    </section>

    <!-- 4. Next Project Navigator -->
    <section class="bg-white border border-slate-200/80 rounded-3xl p-8 sm:p-10 flex flex-col md:flex-row items-center justify-between gap-6 shadow-xl shadow-slate-200/60" data-aos="zoom-in">
        <div class="space-y-2 text-center md:text-start">
            <span class="text-xs font-extrabold text-brand-600 uppercase tracking-widest"

                return this.projects[this.activeSlug] || this.projects['el-sokkary-erp'];
            },

            get nextSlug() {
                const currentIndex = this.slugList.indexOf(this.activeSlug);
                const nextIndex = (currentIndex + 1) % this.slugList.length;
                return this.slugList[nextIndex];
            },

            get nextProject() {
                return this.projects[this.nextSlug];
            },

            init() {
                const params = new URLSearchParams(window.location.search);
                const slug = params.get('project');
                if (slug && this.projects[slug]) {
                    this.activeSlug = slug;
                } else {
                    this.activeSlug = 'el-sokkary-erp';
                }

                this.$nextTick(() => {
                    if (typeof AOS !== 'undefined') {
                        AOS.init({
                            duration: 800,
                            once: true,
                            easing: 'ease-out-cubic'
                        });
                    }
                });
            },

            switchProject(slug) {
                if (this.projects[slug]) {
                    this.activeSlug = slug;
                    window.history.pushState({}, '', '?project=' + slug);
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                    this.$nextTick(() => {
                        if (typeof AOS !== 'undefined') {
                            AOS.refresh();
                        }
                    });
                }
            },

            openLightbox(imgSrc) {
                this.lightboxImg = imgSrc;
                this.lightboxOpen = true;
            },

            closeLightbox() {
                this.lightboxOpen = false;
                this.lightboxImg = '';
            }
        }
